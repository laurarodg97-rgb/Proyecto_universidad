# Desarrollo local: docker compose up --build
#   API:     http://localhost:8000/docs
#   Tablero: http://localhost:8501
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - datos-api:/data
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  datos-api:
